<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Iniciar Sesión</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
            margin-top: 20px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #qrcode {
            margin: 20px auto 0;
            width: 160px;
            height: 160px;
        }
        .qr-label {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>STUDY PLANNER 📚</h1>
        <p>Organiza tus notas y pasa con éxito</p>

        <div id="qrcode"></div>
        <p class="qr-label">Escanea para acceder</p>

        <form id="loginForm">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required placeholder="maria@estudiante.com">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Contraseña">

            <button type="submit" id="submitBtn">Entrar / Registrarse</button>
        </form>
    </div>

    <!-- Lógica de Firebase integrada -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBQKiek2IhxjbNXTQD0ILM8N7FgiGSvFGg",
          authDomain: "study-planner-227ea.firebaseapp.com",
          projectId: "study-planner-227ea",
          storageBucket: "study-planner-227ea.appspot.com",
          messagingSenderId: "466515391342",
          appId: "1:466515391342:web:8fac5d1ecb2a32c40ac77f",
          measurementId: "G-H2WH3TXRYS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("¡Login exitoso! Redirigiendo...");
                window.location.href = "dashboard.html";
            } catch (error) {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("¡Usuario creado con éxito! Redirigiendo...");
                    window.location.href = "dashboard.html";
                } catch (createError) {
                    alert("Error: " + createError.message);
                }
            }
        });

        // Generar QR que lleva a Study Planner en Netlify
        const appUrl = "https://studyplannermsjd.netlify.app/";
        new QRCode(document.getElementById("qrcode"), {
            text: appUrl,
            width: 160,
            height: 160,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
